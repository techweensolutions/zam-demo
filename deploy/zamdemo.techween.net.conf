# nginx site for the ZAM demo stores on the gateway (qema-dev, 192.168.8.100).
#
# The demo server runs on 192.168.8.170:8090. This gives it the public name
# zamdemo.techween.net; certbot adds the https server and the redirect.
#
#   sudo cp zamdemo.techween.net.conf /etc/nginx/sites-available/zamdemo.techween.net
#   sudo ln -s /etc/nginx/sites-available/zamdemo.techween.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d zamdemo.techween.net

# Creating an order costs a payment session at ZAM, and this site is on the
# internet. Limit creating orders (POST) per address; reading an order's status,
# which the page does every few seconds, and the pages themselves are not limited.
map $request_method $zamdemo_order_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $zamdemo_order_key zone=zamdemo_orders:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name zamdemo.techween.net;

    client_max_body_size 16k;

    location / {
        proxy_pass         http://192.168.8.170:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /api/orders/ {
        limit_req          zone=zamdemo_orders burst=5 nodelay;
        limit_req_status   429;
        proxy_pass         http://192.168.8.170:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The demo is a public page. If you would rather keep it to people you give
    # a password to, uncomment these two lines and create the file with
    #   sudo htpasswd -c /etc/nginx/zamdemo.htpasswd <name>
    # auth_basic           "ZAM demo";
    # auth_basic_user_file /etc/nginx/zamdemo.htpasswd;
}
